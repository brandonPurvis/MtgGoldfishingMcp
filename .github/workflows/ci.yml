name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run behave
      # @spec APP-080: the HTTP scenarios start the real service; CI runs them, commits do not.
      - run: uv run behave features/http --tags=@http
