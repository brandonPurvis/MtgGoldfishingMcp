# Scenarios of behavior not yet built are tagged @wip and left out by default, as pytest's
# expected failures are; run them alone with `uv run behave --tags=@wip`.
# The scenarios under features/http start the real service and are tagged @http; like the
# end-to-end tests they are run by CI, not before commits:
# `uv run behave features/http --tags=@http`.
[behave]
default_tags = not @wip and not @http
