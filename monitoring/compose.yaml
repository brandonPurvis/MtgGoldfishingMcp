# The monitoring stack: an OpenTelemetry collector, Prometheus and Grafana in one container.
# Start with:  docker compose -f monitoring/compose.yaml up -d
# Stop with:   docker compose -f monitoring/compose.yaml down
name: mtg-goldfishing-monitoring

services:
  lgtm:
    image: grafana/otel-lgtm:0.39.0
    ports:
      - "127.0.0.1:4318:4318" # OTLP over HTTP
      - "127.0.0.1:4317:4317" # OTLP over gRPC
      - "127.0.0.1:3000:3000" # Grafana
    volumes:
      - lgtm-data:/data
      - ./dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/mtg-goldfishing.yaml:ro
      - ./dashboards:/otel-lgtm/mtg-goldfishing-dashboards:ro

volumes:
  lgtm-data:
