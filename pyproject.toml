[project]
name = "mtg-goldfishing"
version = "0.1.0"
description = "An MCP service that holds the state of agent-played Commander goldfish games."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "mcp>=1.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
mtg-goldfishing = "mtg_goldfishing.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_goldfishing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: starts the real service; excluded from the pre-commit run"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "features"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import order
  "B",        # bugbear
  "UP",       # modern syntax
  "SIM",      # simplifications
  "C4",       # comprehensions
  "PT",       # pytest style
  "RET",      # return statements
  "PL",       # pylint subset
  "RUF",      # ruff's own
]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # size limits; judged in review, not by count
  "PLR2004",                                   # literal numbers are game constants (7 cards, 40 life)
  "RUF001", "RUF002", "RUF003",                # the response format uses · → × on purpose
]

[tool.ruff.lint.per-file-ignores]
"features/steps/*.py" = ["F811"]   # behave steps reuse the name step_impl

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
mypy_path = "src"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
